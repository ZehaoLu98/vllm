# Maximum character length for system prompts (truncated if longer)
system_prompt_length: 0

# Character length of generated descriptive text
initial_descriptive_length: 30000

# Maximum descriptive length when picking from history (0 = no cap)
max_descriptive_length: 35000

# Character length of generated query text
query_length: 0

# Number of initial prompts that always generate new descriptive text (building history)
warmup_count: 100

# Total number of prompts to generate
total_count: 800

# Probability (0.0–1.0) of reusing a descriptive text from history after warmup
pick_from_hist_pctg: 1

# Output JSON file path
output_file: "l0_hit_l1_hit.json"

# Number of output tokens per prompt (written into JSONL for vllm benchmark)
output_tokens: 1

# History range: limits which history entries can be picked from.
# hist_range_size: number of most-recent history entries to pick from.
#   0 means the whole history.
hist_range_size: 0

# Pick mode within the history range: "random" or "iterative".
# "iterative" picks most-recently-inserted first and cycles through the range.
pick_mode: "random"

# Whether to randomize the length of the prompt picked from history (between min and max descriptive length).
rand_hist_len: false